# 旧单文件兼容模板；新入口见config/README.md与config/examples五文件。
# schema1/2 are migrated in memory; saving writes schema3 with a full backup.
# Budget fields count visible UTF-8 bytes and envelope, not exact model tokens.
schema_version: 3
memory:
  enabled: false
  learning_enabled: false
  max_records: 64
  max_fact_bytes: 16384
  max_group_file_bytes: 65536
  max_groups: 16
  max_total_bytes: 8388608
  max_prompt_records: 8
  max_prompt_bytes: 1536
  max_proposals_per_turn: 3
  max_record_bytes: 240
vision:
  enabled: false  # production_eligible未证明；true会在启动时拒绝，不自动调用验证
  input_reserve_tokens: 4096  # 待验证假设，不能当视觉token/patch上界
participation:
  # 临时停言默认开启；普通成员明确要求后本群静默，下一条真实@恢复；重启复位，无超时解除。
  silence:
    enabled: true  # 下次正常启动生效；false关闭此能力，省略仍默认true
  # LAP-27仅free显式开启生效，mentions保留真实@；保存须停机/重启加载
  attention:
    enabled: false
    aliases: [肥鱼, 大肥鱼, 鱼鱼, 鲸鱼娘, 小鲸鱼, DSH]
    focus_ttl_seconds: 60
    max_intervening_messages: 0
    direct_queue_limit: 4
    focus_candidate_evaluations_per_minute: 4
  mode: mentions
  debounce_seconds: 2
  max_batch_wait_seconds: 5
  min_evaluation_interval_seconds: 5
  max_evaluations_per_minute: 12
  unsolicited_cooldown_seconds: 15
  max_unsolicited_per_minute: 4
  context_messages: 60
  context_ttl_seconds: 900
  context_max_bytes: 32768
  message_max_chars: 2000
  mention_queue_limit: 8
  max_ambient_age_seconds: 90
  allow_ambient_web: true
web:
  enabled: false
  trigger: auto
  provider: bing_rss
  max_searches: 1
  max_results: 5
  max_pages: 2
  timeout_seconds: 15
  max_redirects: 2
  max_response_bytes: 1048576
  max_page_text_bytes: 4000
  max_evidence_bytes: 6000
  max_sources: 2
bot:
  qq: REQUIRED_PERSONAL_BOT_QQ
access:
  allowed_groups:
  - REQUIRED_TEST_GROUP
  blocked_users: []
  admin_users:
  - REQUIRED_ADMIN_QQ
  private_enabled: false
onebot:
  host: 127.0.0.1
  port: 6200
  upstream: ws://127.0.0.1:6199/ws
secrets_file: secrets/local-tokens.json
llm:
  backend: codebuddy_cli
  host: 127.0.0.1
  port: 8765
  max_concurrency: 1
  queue_limit: 5
  queue_wait_seconds: 30
  cleanup_seconds: 5
  profiles:
    codebuddy_cli:
      model: deepseek-v4.1-flash
      reasoning_effort: auto
      context_window_tokens: null
      run_timeout_seconds: 90
      input_budget:
        context_input_limit_tokens: 16384
        context_overhead_reserve_tokens: 2048
        output_reserve_tokens: 2048
    ollama_ssh:
      model: qwen3.5:9b-q4_K_M
      expected_digest: null
      access_file: secrets/home-5070-runtime.local.json
      num_ctx: 16384
      think: false
      num_predict: 1024
      keep_alive_seconds: 300
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      run_timeout_seconds: 120
      input_budget:
        context_input_limit_tokens: 12288
        context_overhead_reserve_tokens: 2048
        output_reserve_tokens: 2048
chat:
  history_turns: 8
output:
  quote_reply: false
  mode: plain_chat
  max_reply_chars: 1200
  delivery_mode: single
  max_bubbles: 3
  casual_max_chars: 80
  bubble_max_chars: 40
  bubble_delay_min_ms: 800
  bubble_delay_max_ms: 1600

# 受控表情；默认关闭，扫描/标签/目录激活须停机，重启生效
memes:
  enabled: false
  inbox_dir: assets/memes/inbox
  library_dir: assets/memes/library
  catalog_file: config/memes.local.yaml
  max_candidates: 16
  catalog_prompt_max_bytes: 2000
  max_images_per_turn: 1
  cooldown_seconds: 60
  same_meme_cooldown_seconds: 300
  allow_meme_only: true
  max_file_bytes: 8388608
  import_count: 48

# LAP-29：生产人数新鲜度未证，配置工具拒绝启用；手改desired启动仅暂停本功能。
# received_at不是人数观测时间；只允许1..49，50/未知/过期零list。
members:
  enabled: false
  mentions_enabled: false
  roster_member_count_lt: 50
  count_ttl_seconds: 60
  roster_ttl_seconds: 300
  max_prompt_entries: 8
  max_prompt_bytes: 768
