schema_version: 2
bot:
  qq: "REQUIRED_PERSONAL_BOT_QQ"
access:
  allowed_groups: ["REQUIRED_TEST_GROUP"]
  blocked_users: []
  admin_users: ["REQUIRED_ADMIN_QQ"]
  private_enabled: false
onebot:
  host: 127.0.0.1
  port: 6200
  upstream: ws://127.0.0.1:6199/ws
secrets_file: secrets/local-tokens.json
llm:
  backend: codebuddy_cli
  model: deepseek-v4.1-flash
  reasoning_effort: auto
  context_window_tokens: null  # Native window unverified: only null/auto is accepted.
  host: 127.0.0.1
  port: 8765
  max_concurrency: 1
  queue_limit: 5
  queue_wait_seconds: 30
  run_timeout_seconds: 90
  cleanup_seconds: 5
# Input budget counts visible UTF-8 bytes + serialized envelope + overhead, not exact model tokens.
chat:
  history_turns: 8
  context_input_limit_tokens: 16384
  context_overhead_reserve_tokens: 2048
  output_reserve_tokens: 2048
output:
  # Explicitly choose adaptive for limited bubbles; missing fields keep single.
  mode: plain_chat
  max_reply_chars: 1200
  delivery_mode: single
  max_bubbles: 3
  casual_max_chars: 80
  bubble_max_chars: 40
  bubble_delay_min_ms: 800
  bubble_delay_max_ms: 1600
