# features.yaml：联网、表情、记忆、视觉与成员；视觉生产拒启，成员生产暂停，搜索门槛关闭
# 同目录五文件共同组成配置；其他文件见config/README.md。
# 本机config/local不提交；保存后下次正常启动生效，不热更新。
web:  # 配置节，子字段见下方；保留既有校验约束
  enabled: false  # 共用网页读取开关；搜索质量门槛仍关闭，不代表完整搜索可用；新装默认 false
  trigger: auto  # 联网触发auto/explicit；新装默认 "auto"
  provider: bing_rss  # 搜索提供方固定bing_rss，当前搜索质量门槛关闭；新装默认 "bing_rss"
  max_searches: 1  # 搜索最多1次；新装默认 1
  max_results: 5  # 搜索结果1..5条；新装默认 5
  max_pages: 2  # 正文1..2页；新装默认 2
  timeout_seconds: 15  # 联网总超时秒5..15；新装默认 15
  max_redirects: 2  # 重定向0..2次；新装默认 2
  max_response_bytes: 1048576  # 响应上限65536..1048576字节；新装默认 1048576
  max_page_text_bytes: 4000  # 单页正文1000..8000字节；新装默认 4000
  max_evidence_bytes: 6000  # 联网材料1000..12000字节；新装默认 6000
  max_sources: 2  # 来源1..2项；新装默认 2
memes:  # 配置节，子字段见下方；保留既有校验约束
  enabled: false  # 发送已登记表情图片的开关，不开放任意媒体；新装默认 false
  inbox_dir: assets/memes/inbox  # 固定项目assets/memes/inbox，本机素材不提交；新装默认 "assets/memes/inbox"
  library_dir: assets/memes/library  # 固定项目assets/memes/library；新装默认 "assets/memes/library"
  catalog_file: config/memes.local.yaml  # 固定config/memes.local.yaml，是图库数据而非发送开关；新装默认 "config/memes.local.yaml"
  max_candidates: 16  # 表情候选数1..32；新装默认 16
  catalog_prompt_max_bytes: 2000  # 表情提示500..4000字节；新装默认 2000
  max_images_per_turn: 1  # 单轮固定最多1图；新装默认 1
  cooldown_seconds: 60  # 表情冷却秒0..600；新装默认 60
  same_meme_cooldown_seconds: 300  # 同图冷却秒0..3600；新装默认 300
  allow_meme_only: true  # 允许仅发送已登记表情，不开放任意媒体；新装默认 true
  max_file_bytes: 8388608  # 表情单文件1048576..8388608字节；新装默认 8388608
  import_count: 48  # 显式导入数量1..48；新装默认 48
memory:  # 配置节，子字段见下方；保留既有校验约束
  enabled: false  # 读取本群长期记忆的开关，不等于开启学习；新装默认 false
  learning_enabled: false  # 记忆学习开关，必须同时开启记忆读取，不新增推理调用；新装默认 false
  max_records: 64  # 每群记忆记录数上限；新装默认 64
  max_fact_bytes: 16384  # 每群记忆事实总字节上限；新装默认 16384
  max_group_file_bytes: 65536  # 单群记忆文件字节上限；新装默认 65536
  max_groups: 16  # 可持久化群数上限；新装默认 16
  max_total_bytes: 8388608  # 记忆总字节上限；新装默认 8388608
  max_prompt_records: 8  # 单次记忆提示记录数上限；新装默认 8
  max_prompt_bytes: 1536  # 记忆/成员提示UTF-8字节上限；新装默认 1536
  max_proposals_per_turn: 3  # 单轮学习提议数上限；新装默认 3
  max_record_bytes: 240  # 单条记忆UTF-8字节上限；新装默认 240
vision:  # 配置节，子字段见下方；保留既有校验约束
  enabled: false  # 原生识图desired开关；生产能力未验证，true仍拒绝启动；新装默认 false
  input_reserve_tokens: 4096  # 视觉预留4096仅假设，容量/上界未证，true仍拒启动；新装默认 4096
members:  # 配置节，子字段见下方；保留既有校验约束
  enabled: false  # 小群成员desired开关；人数新鲜度未证，生产仍暂停；新装默认 false
  mentions_enabled: false  # 受控成员@开关，仍受成员生产暂停门槛限制；新装默认 false
  roster_member_count_lt: 50  # 人数必须小于50；未知/过期暂停，不以收到时间假冒观测时间；新装默认 50
  count_ttl_seconds: 60  # 人数有效秒数；新装默认 60
  roster_ttl_seconds: 300  # 名册有效秒数；新装默认 300
  max_prompt_entries: 8  # 成员提示条目上限；新装默认 8
  max_prompt_bytes: 768  # 记忆/成员提示UTF-8字节上限；新装默认 768
